<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8EFF01" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#8116E0" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFFFC" />
      <stop offset="25%" stop-color="#8EFF01" />
      <stop offset="100%" stop-color="#6ED600" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0c" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Canvas -->
  <rect width="400" height="500" rx="24" fill="url(#darkBg)" />
  <rect width="400" height="500" rx="24" fill="url(#avatarGlow)" />

  <!-- Subtle Cyber Tech Framing -->
  <circle cx="200" cy="195" r="115" fill="none" stroke="#8EFF01" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="200" cy="195" r="92" fill="none" stroke="#8EFF01" stroke-opacity="0.22" stroke-width="1.5" />
  <circle cx="200" cy="195" r="76" fill="#090909" stroke="#8EFF01" stroke-opacity="0.35" stroke-width="2" />

  <!-- User / Designer Avatar Icon in Lime Green #8EFF01 -->
  <!-- Head -->
  <circle cx="200" cy="172" r="34" fill="url(#limeGrad)" />
  
  <!-- Creative Headphones / Arc -->
  <path d="M158 172 A42 42 0 0 1 242 172" fill="none" stroke="#8EFF01" stroke-width="4.5" stroke-linecap="round" />
  <rect x="152" y="164" width="8" height="20" rx="3" fill="#8EFF01" />
  <rect x="240" y="164" width="8" height="20" rx="3" fill="#8EFF01" />

  <!-- Shoulders & Torso -->
  <path d="M128 300 C128 244 156 226 200 226 C244 226 272 244 272 300 C272 312 264 318 252 318 L148 318 C136 318 128 312 128 300 Z" fill="url(#limeGrad)" />

  <!-- Creative Stylus Pen Accent -->
  <g transform="translate(238, 252)">
    <polygon points="0,0 18,-18 23,-13 5,5 -2,7" fill="#8EFF01" />
    <circle cx="21" cy="-16" r="2" fill="#FEFFFC" />
  </g>

  <!-- Artist Identity Badge -->
  <rect x="110" y="360" width="180" height="28" rx="14" fill="#141414" stroke="#8EFF01" stroke-opacity="0.3" stroke-width="1" />
  <text x="200" y="378" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="600" font-size="11" fill="#8EFF01" letter-spacing="2">EMKAY VISUALS</text>

  <text x="200" y="415" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="500" font-size="11" fill="#FEFFFC" fill-opacity="0.55" letter-spacing="1">GRAPHIC &amp; DIGITAL ARTIST</text>
  <text x="200" y="432" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="400" font-size="9" fill="#FEFFFC" fill-opacity="0.3" letter-spacing="1">PHOTO COMING SOON</text>
</svg>
